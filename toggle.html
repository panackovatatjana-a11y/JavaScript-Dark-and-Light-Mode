<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark & Light Mode Templates</title>
  <link rel="stylesheet" href="toggle.css">

</head>
<body class="light-mode", class="dark-mode">
    <header>
        <h1>My Blog Dashboard</h1>
        <button id="togglebtn" type="button">Toggle theme</button>
    </header>
    <main>
        <section class="card">
            <h2>Latest Article</h2>
            <p>This is an example article.</p>
            
        </section>
        <section class="card">
            <h2>News Update</h2>
            <p>Here is another section to demostrate the theme switching</p>
        </section>
    </main>
    <script src="toggle.js"></script>
</body>
</html>
